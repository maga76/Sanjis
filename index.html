<!DOCTYPE html>
<html lang="tg">
<head>
  <!-- Путь сайта подставляет `flutter build web --base-href` -->
  <base href="/Sanjis/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sanjish — тестҳо барои мактаббачагони Тоҷикистон, синфҳои 1–11.">
  <meta name="theme-color" content="#1E5AA8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sanjish">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Sanjish</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0F2A4D; }
    /* Заставка, пока загружается приложение */
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background-color: #1E5AA8;
      background-image:
        linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      transition: opacity .3s;
    }
    #splash img { width: 112px; height: 112px; }
    #splash h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: .5px; }
    #splash .bar {
      width: 160px; height: 4px; border-radius: 2px; overflow: hidden;
      background: rgba(255,255,255,.25);
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #F2A900; border-radius: 2px;
      animation: load 1.2s ease-in-out infinite;
    }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <h1>Sanjish</h1>
    <div class="bar"></div>
  </div>
  <script>
    // Flutter нарисовал первый кадр — убираем заставку
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
