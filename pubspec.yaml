name: sanjish
description: "Санҷиш — тестҳо барои мактаббачагони Тоҷикистон."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Состояние и навигация
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

  # Локальные настройки (язык, тема, размер шрифта)
  shared_preferences: ^2.5.6

  # Версия интл-пакета задаётся flutter_localizations, поэтому any
  intl: any

  # Версия приложения на экране настроек
  package_info_plus: ^10.2.2
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  cloud_firestore: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Генерация классов локализации из ARB-файлов (см. l10n.yaml)
  generate: true

  # Noto Sans подключён файлами: в нём есть все таджикские буквы (Ғ Ӣ Қ Ӯ Ҳ Ҷ)
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
